[package]
name = "pyadagram"
version = "0.1.0"
edition = "2024"

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
pyo3 = { version = "0.29.1", features = ["extension-module", "abi3"] }
adagram = { git = "https://github.com/ondra/adagram" }
mimalloc = { version = "0.1.48", optional = true }
tikv-jemallocator = { version = "0.6", optional = true }

[lib]
name = "adagram"
crate-type = ["cdylib"]
